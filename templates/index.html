<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PED Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="topbar">
        <h1>PED Tools <span class="page-subtitle">JSON &amp; Encryption Workbench</span></h1>
        <a href="/" class="active">Home</a>
        <a href="/proxy/">Proxy Server</a>
        <a href="/proxy/helper">Docs</a>
        {% if session.get('authenticated') %}
        <a href="/proxy/manage/">Manage</a>
        <span class="nav-spacer"></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        <a href="/logout" style="opacity:0.8;">Logout</a>
        {% else %}
        <span class="nav-spacer"></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        <a href="/login">Login</a>
        {% endif %}
    </div>

    <div class="toolbar">
        <!-- Prettify / Minify group -->
        <div class="toolbar-group">
            <input type="checkbox" id="processEscape" />
            <label for="processEscape">Escapes</label>
            <button class="btn btn-blue" onclick="prettify()" data-tooltip="Ctrl+Enter">Prettify</button>
            <button class="btn btn-outline" onclick="minifyJson()" data-tooltip="Compact JSON">Minify</button>
            <button class="btn btn-outline" onclick="jsonView()" data-tooltip="Ctrl+Shift+V — Smart format any text">JSON View</button>
        </div>

        <!-- JSON Tools group -->
        <div class="toolbar-group">
            <span class="toolbar-group-label">JSON</span>
            <button class="btn btn-outline" onclick="jsonPathQuery()" data-tooltip="Extract by dot-path">Path</button>
            <button class="btn btn-outline" onclick="jsonDiffTool()" data-tooltip="Input vs Output">Diff</button>
            <button class="btn btn-outline" onclick="jsonSchemaValidate()" data-tooltip="Validate structure">Schema</button>
            <button class="btn btn-outline" onclick="jsonTransform()" data-tooltip="Transform pipeline">Transform</button>
        </div>

        <!-- Encrypt/Decrypt group -->
        <div class="toolbar-group">
            <span class="toolbar-group-label">AES</span>
            <input type="text" id="encIv" placeholder="IV" />
            <input type="text" id="secret" placeholder="Secret" />
            <button class="btn btn-green" onclick="encryptData()" data-tooltip="Ctrl+Shift+E">Encrypt</button>
            <button class="btn btn-blue" onclick="decryptData()" data-tooltip="Ctrl+Shift+D">Decrypt</button>
        </div>
    </div>

    <div class="editors">
        <!-- Input pane -->
        <div class="editor-pane">
            <div class="pane-header">
                <span class="icon-text"><span class="icon">&#9998;</span> Input</span>
                <div class="pane-actions">
                    <button class="btn-sm" onclick="formatInput()" data-tooltip="Format JSON">Format</button>
                    <button class="btn-sm" onclick="clearInput()">Clear</button>
                    <button class="btn-sm" onclick="pasteInput()">Paste</button>
                </div>
            </div>
            <textarea class="editor" id="inputEditor" placeholder="Paste JSON, encrypted data, or raw text here..." spellcheck="false"></textarea>
        </div>

        <!-- Resize handle -->
        <div class="resize-handle" id="resizeHandle" title="Drag to resize"></div>

        <!-- Output pane -->
        <div class="editor-pane">
            <div class="pane-header">
                <span class="icon-text"><span class="icon">&#10004;</span> Output</span>
                <div class="pane-actions">
                    <button class="btn-sm" onclick="copyOutput()">Copy</button>
                    <button class="btn-sm" onclick="moveToInput()">&#8592; To Input</button>
                    <button class="btn-sm" onclick="clearOutput()">Clear</button>
                </div>
            </div>
            <textarea class="editor" id="outputEditor" placeholder="Results appear here..." readonly spellcheck="false"></textarea>
        </div>
    </div>

    <div class="statusbar">
        <span id="inputStatus">Input: 0 chars</span>
        <span id="inputLines">0 lines</span>
        <span class="statusbar-sep">|</span>
        <span id="outputStatus">Output: 0 chars</span>
        <span id="outputLines">0 lines</span>
        <span class="statusbar-spacer"></span>
        <span class="statusbar-hint">
            <kbd>Ctrl</kbd>+<kbd>Enter</kbd> Prettify &nbsp;
            <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd> Encrypt &nbsp;
            <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd> Decrypt
        </span>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/index.js"></script>
<script>
(function(){var t=localStorage.getItem('ped-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'})();
function toggleTheme(){var d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);localStorage.setItem('ped-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
</script>
</body>
</html>
