<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PED Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="topbar">
        <h1>PED Tools</h1>
        <a href="/" class="active">Home</a>
        <a href="/proxy/">Proxy Server</a>
        <a href="/proxy/helper">Docs</a>
        {% if session.get('authenticated') %}
        <a href="/proxy/manage/">Manage</a>
        <span class="nav-spacer"></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        <a href="/logout" style="opacity:0.8;">Logout</a>
        {% else %}
        <span class="nav-spacer"></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        <a href="/login">Login</a>
        {% endif %}
    </div>

    <div class="toolbar">
        <!-- Prettify group -->
        <div class="toolbar-group">
            <input type="checkbox" id="processEscape" />
            <label for="processEscape">Process Escapes</label>
            <button class="btn btn-blue" onclick="prettify()">Prettify</button>
        </div>

        <!-- Encrypt/Decrypt group -->
        <div class="toolbar-group">
            <label for="encIv">IV:</label>
            <input type="text" id="encIv" placeholder="Enter enc_iv" />
            <label for="secret">Secret:</label>
            <input type="text" id="secret" placeholder="Enter secret" />
            <button class="btn btn-green" onclick="encryptData()">Encrypt</button>
            <button class="btn btn-blue" onclick="decryptData()">Decrypt</button>
        </div>
    </div>

    <div class="editors">
        <!-- Input pane -->
        <div class="editor-pane">
            <div class="pane-header">
                <span>Input</span>
                <div class="pane-actions">
                    <button class="btn-sm" onclick="formatInput()">Format</button>
                    <button class="btn-sm" onclick="clearInput()">Clear</button>
                    <button class="btn-sm" onclick="pasteInput()">Paste</button>
                </div>
            </div>
            <textarea class="editor" id="inputEditor" placeholder="Paste JSON, encrypted data, or raw text here..."></textarea>
        </div>

        <!-- Output pane -->
        <div class="editor-pane">
            <div class="pane-header">
                <span>Output</span>
                <div class="pane-actions">
                    <button class="btn-sm" onclick="copyOutput()">Copy</button>
                    <button class="btn-sm" onclick="moveToInput()">&#8592; Use as Input</button>
                    <button class="btn-sm" onclick="clearOutput()">Clear</button>
                </div>
            </div>
            <textarea class="editor" id="outputEditor" placeholder="Results appear here..." readonly></textarea>
        </div>
    </div>

    <div class="statusbar">
        <span id="inputStatus">Input: 0 chars</span>
        <span id="outputStatus">Output: 0 chars</span>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/index.js"></script>
<script>
(function(){var t=localStorage.getItem('ped-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'})();
function toggleTheme(){var d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);localStorage.setItem('ped-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
</script>
</body>
</html>
