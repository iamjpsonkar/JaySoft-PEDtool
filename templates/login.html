<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PED Tools | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="lock-icon">&#128274;</div>
        <h1>PED Tools</h1>
        <p>Enter password to access the dashboard</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" autofocus required />
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="login-footer">
            <a href="/">Home</a>
            <a href="/proxy/">Mock Builder</a>
            <a href="/proxy/helper">Docs</a>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
    <script>
    (function(){var t=localStorage.getItem('ped-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
    </script>
</body>
</html>
