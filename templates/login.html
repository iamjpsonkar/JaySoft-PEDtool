<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PED Tools | Login</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="lock-icon">&#128274;</div>
        <h1>PED Tools</h1>
        <p>Enter password to access the dashboard</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" autofocus required />
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-border);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <a href="/" style="font-size:0.85rem;color:var(--blue);text-decoration:none;">Home</a>
            <a href="/proxy/" style="font-size:0.85rem;color:var(--blue);text-decoration:none;">Mock Builder</a>
            <a href="/proxy/helper" style="font-size:0.85rem;color:var(--blue);text-decoration:none;">Docs</a>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
